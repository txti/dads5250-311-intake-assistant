[project]
name = "311-agent"
version = "0.1.0"
description = "An agentic 311 intake assistant that turns a resident's plain-language message into the right request type and department."
readme = "README.md"
requires-python = "==3.12.3"
dependencies = [
    "gradio>=6.17.3",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "lancedb>=0.40.0",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.0.2",
    "langgraph>=1.2.16",
    "matplotlib>=3.11.2",
    "nbformat>=4.2.0",
    "openai>=3.19.2",
    "pandas>=3.0.1",
    "pip>=26.2.1",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
]
